name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query posts table
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/posts?select=slug&limit=1")
          echo "Supabase odpowiedział $status"
          test "$status" = "200"
